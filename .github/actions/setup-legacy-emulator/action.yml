name: Set up legacy emulator runtime
description: Use a pinned official runtime for the Android 6 SDK images
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        legacy_emulator_root=$(mktemp -d "$RUNNER_TEMP/kitsune-legacy-emulator.XXXXXX")
        archive="$legacy_emulator_root/emulator.zip"
        # Android's emulator archive, 35.3.11 stable (build 12836668).
        curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
          https://edgedl.me.gvt1.com/edgedl/android/repository/emulator-linux_x64-12836668.zip \
          --output "$archive"
        echo "160fec5c31b4e3b81c47c18dcb0d103fc4dfb13396dd75463d02a945e8f60d5c  $archive" \
          | sha256sum --check --status
        unzip -q "$archive" -d "$legacy_emulator_root"
        rm "$archive"
        "$legacy_emulator_root/emulator/emulator" -version
        echo "AVD_EMULATOR_BINARY=$legacy_emulator_root/emulator/emulator" >> "$GITHUB_ENV"
